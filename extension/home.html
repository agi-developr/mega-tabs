<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title data-i18n="spaces"></title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="home.css">
</head>
<body class="home">
  <header>
    <h1 data-i18n="spaces"></h1>
    <p id="files-off" class="dim" hidden><span data-i18n="filesOffLead"></span> <button id="open-setup" class="quiet" type="button" data-i18n="setUp"></button></p>
  </header>
  <section id="setup" hidden aria-labelledby="setup-title">
    <h2 id="setup-title" data-i18n="homeSetupTitle"></h2>
    <p id="setup-text"></p>
    <p><button id="retry" class="quiet" type="button" data-i18n="retryBtn"></button> <span id="retry-note" class="dim" role="status"></span></p>
  </section>
  <main id="tiles" data-i18n-label="spaces"></main>
  <p id="note" class="error" role="alert" hidden></p>
  <script src="i18n.js"></script>
  <script src="home.js"></script>
</body>
</html>
